<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><title>DrawTogether</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="lobby" class="lobby"><div class="logo">✦ <span>DrawTogether</span></div><p>Desenhem juntos, em tempo real.</p><div class="panel"><input id="nickname" maxlength="18" placeholder="Seu nome (opcional)" autocomplete="nickname"><button id="create">Criar sala</button><div class="or">ou entre com um código</div><input id="roomcode" maxlength="6" placeholder="CÓDIGO DA SALA" class="code"><button id="join" class="secondary">Entrar na sala</button><div id="msg"></div></div><small>Salas privadas · até 5 pessoas</small></section>
<section id="app" hidden><header><button id="exit" class="iconbtn" title="Sair">←</button><strong>DrawTogether</strong><div id="roombadge">Sala —</div><button id="copy" class="smallbtn">Copiar código</button></header><div class="toolbar"><button class="tool active" data-tool="pen" title="Caneta">✎</button><button class="tool" data-tool="marker" title="Marcador">▰</button><button class="tool" data-tool="eraser" title="Borracha">⌫</button><button id="undo" title="Desfazer">↶</button><button id="clear" title="Limpar folha">▧</button><label class="colorwrap" title="Cor"><input id="color" type="color" value="#222222"></label><input id="size" type="range" min="1" max="40" value="5" title="Tamanho"><button id="zoomout" title="Diminuir zoom">−</button><button id="zoomin" title="Aumentar zoom">+</button><button id="resetzoom" title="Zoom normal">1:1</button><button id="save" title="Salvar PNG">↓</button><label class="upload" title="Adicionar imagem">▣<input id="image" type="file" accept="image/*"></label></div><div class="palette" id="palette"></div><div class="people" id="people">👤 1/5</div><main id="viewport"><canvas id="canvas"></canvas></main><div class="hint">Desenhe com o dedo ou mouse · Dois dedos para zoom e mover</div></section>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
