<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ff">
  <link rel="manifest" href="manifest.json">
  <title>DrawTogether</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lobby" class="lobby">
    <div class="brand-mark">✦</div>
    <div class="logo">Draw<span>Together</span></div>
    <p class="tagline">Um cantinho para desenhar juntinhos.</p>
    <div class="panel">
      <label class="field-label" for="nickname">Seu nome <span>(opcional)</span></label>
      <input id="nickname" maxlength="18" placeholder="Como te chamamos?" autocomplete="nickname">
      <button id="create" class="primary">＋ Criar uma sala</button>
      <div class="divider"><span>ou entre com convite</span></div>
      <label class="field-label" for="roomcode">Código da sala</label>
      <input id="roomcode" maxlength="6" placeholder="ABC123" class="code" autocomplete="off">
      <button id="join" class="secondary">Entrar na sala</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </div>
    <div class="lobby-foot">Salas privadas · até 5 pessoas</div>
  </section>

  <section id="app" hidden>
    <header class="topbar">
      <button id="exit" class="iconbtn" title="Sair da sala" aria-label="Sair da sala">‹</button>
      <div class="brand-small">✦ <strong>DrawTogether</strong></div>
      <div id="roombadge" class="room-badge">Sala —</div>
      <button id="copy" class="copybtn">Copiar código</button>
    </header>

    <div class="people" id="people">● 1/5</div>
    <main id="viewport" aria-label="Área de desenho">
      <canvas id="canvas"></canvas>
      <div class="canvas-note">Folha em branco</div>
    </main>

    <div class="palette-wrap">
      <div class="palette" id="palette" aria-label="Paleta de cores"></div>
      <label class="custom-color" title="Escolher outra cor" aria-label="Escolher outra cor">
        <span>＋</span><input id="color" type="color" value="#292b36">
      </label>
    </div>

    <div class="tool-dock">
      <div class="tools">
        <button class="tool active" data-tool="pen" title="Caneta" aria-label="Caneta">✎</button>
        <button class="tool" data-tool="marker" title="Marcador" aria-label="Marcador">▰</button>
        <button class="tool" data-tool="eraser" title="Borracha" aria-label="Borracha">⌫</button>
        <button id="undo" title="Desfazer" aria-label="Desfazer">↶</button>
        <button id="clear" title="Limpar folha" aria-label="Limpar folha">▤</button>
        <label class="upload" title="Abrir imagem para colorir" aria-label="Abrir imagem para colorir">▧<input id="image" type="file" accept="image/*"></label>
        <button id="save" title="Salvar desenho" aria-label="Salvar desenho">↓</button>
      </div>
      <div class="brush-row">
        <span class="brush-label">Tamanho</span>
        <input id="size" type="range" min="1" max="40" value="5" title="Tamanho do pincel">
        <span id="sizeValue">5</span>
        <div class="zoom-controls">
          <button id="zoomout" aria-label="Diminuir zoom">−</button>
          <button id="resetzoom" aria-label="Restaurar zoom">100%</button>
          <button id="zoomin" aria-label="Aumentar zoom">＋</button>
        </div>
      </div>
    </div>
    <div class="hint">Desenhe com um dedo · Pinça com dois dedos para zoom e mover</div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
